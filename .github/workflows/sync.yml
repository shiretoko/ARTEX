name: Sync Fork
on:
  schedule:
    - cron: '0 */6 * * *'  # ทุก 6 ชม.
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git remote add upstream https://github.com/mhtsec/ARTEX.git
          git fetch upstream
          git merge upstream/main
          git push origin main
